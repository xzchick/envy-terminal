name: Cross-platform tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python and dependencies
        run: uv sync --locked --no-editable --python ${{ matrix.python-version }}
      - name: Run Python unit and smoke tests
        run: uv run --no-editable python -m unittest discover -s tests -v
      - name: Run platform installer smoke check (POSIX)
        if: runner.os != 'Windows'
        run: ENVY_SKIP_SERVE=1 ENVY_SKIP_PULL=1 sh scripts/setup.sh
      - name: Run platform installer smoke check (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup.ps1 -SkipModels -SkipServe
      - name: Build distributable wheel and checksums
        run: |
          uv build --wheel --out-dir dist
          uv run --no-editable python -c "import hashlib, pathlib; d=pathlib.Path('dist'); lines=[hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in sorted(d.glob('*.whl'))]; (d/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n', encoding='utf-8'); print((d/'SHA256SUMS.txt').read_text(encoding='utf-8'))"
      - name: Run public-package checks
        run: uv run --no-editable python scripts/check_public.py
      - name: Upload platform wheel and checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: envy-terminal-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/*.whl
            dist/SHA256SUMS.txt
