name: Cross-platform tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python and dependencies
        run: uv sync --locked --no-editable --python ${{ matrix.python-version }}
      - name: Run Python unit and smoke tests
        run: uv run --no-editable python -m unittest discover -s tests -v
      - name: Run platform installer smoke check (POSIX)
        if: runner.os != 'Windows'
        run: ENVY_SKIP_SERVE=1 ENVY_SKIP_PULL=1 sh scripts/setup.sh
      - name: Run platform installer smoke check (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup.ps1 -SkipModels -SkipServe
      - name: Build standalone native OS bundle, wheel, sdist, and SHA256SUMS
        run: uv run --no-editable python scripts/build_release_bundle.py
      - name: Run clean-machine standalone bundle installation and launch smoke test
        run: uv run --no-editable python scripts/smoke_test_release.py
      - name: Run public-package checks
        run: uv run --no-editable python scripts/check_public.py
      - name: Upload platform release bundle, wheel, and checksum artifacts
        uses: actions/upload-artifact@v4
        with:
          name: envy-terminal-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/envy-terminal-v*.tar.gz
            dist/envy-terminal-v*.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
