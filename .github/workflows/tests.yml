name: Tests and public-package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-editable --python 3.12
      - run: uv run --no-editable python -m unittest discover -s tests -v
      - run: uv run --no-editable python scripts/check_public.py
