name: Cross-platform tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python and dependencies
        run: uv sync --locked --no-editable --python ${{ matrix.python-version }}
      - name: Run Python tests
        run: uv run --no-editable python -m unittest discover -s tests -v
      - name: Run public-package checks
        run: uv run --no-editable python scripts/check_public.py
